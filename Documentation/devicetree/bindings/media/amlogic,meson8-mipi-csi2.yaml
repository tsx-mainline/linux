%YAML 1.2
---
$id: http://devicetree.org/schemas/media/amlogic,meson8-mipi-csi2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic Meson8 MIPI CSI-2 receiver

maintainers:
  - unex <7575866+unex@users.noreply.github.com>

description:
  The MIPI CSI-2 receiver of the Meson8 and Meson8m2 SoCs has a D-PHY, a
  Synopsys DesignWare CSI-2 host and an Amlogic CSI-2 adapter. The analog
  part of the D-PHY is in the HHI system controller. The adapter writes
  the received frames directly to memory.

properties:
  compatible:
    const: amlogic,meson8-mipi-csi2

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: host
      - const: phy
      - const: adapter

  interrupts:
    maxItems: 1
    description: frame interrupt of the adapter

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: csi
      - const: phy

  amlogic,hhi-sysctrl:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the HHI system controller

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    description: input port, connected to the sensor

    properties:
      endpoint:
        $ref: video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4

        required:
          - data-lanes

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names
  - amlogic,hhi-sysctrl
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/meson8b-clkc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    csi@d0140000 {
        compatible = "amlogic,meson8-mipi-csi2";
        reg = <0xd0140000 0x100>,
              <0xd0142000 0x80>,
              <0xd010a800 0x58>;
        reg-names = "host", "phy", "adapter";
        interrupts = <GIC_SPI 95 IRQ_TYPE_EDGE_RISING>;
        clocks = <&clkc CLKID_CSI_DIG_CLKIN>, <&clkc CLKID_MIPI_PHY>;
        clock-names = "csi", "phy";
        amlogic,hhi-sysctrl = <&hhi>;

        port {
            csi_in: endpoint {
                remote-endpoint = <&sensor_out>;
                data-lanes = <1 2>;
            };
        };
    };
...
