%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mscc,zl38060.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZL38060 Connected Home Audio Processor from Microsemi.

description: |
  The ZL38060 is a "Connected Home Audio Processor" from Microsemi,
  which consists of a Digital Signal Processor (DSP), several Digital
  Audio Interfaces (DAIs), analog outputs, and a block of 14 GPIOs.
  The ZL38051 voice processor of the same ("Timberwolf") family has the
  same host bus interface. Both can be connected over SPI or I2C.

maintainers:
  - Jaroslav Kysela <perex@perex.cz>
  - Takashi Iwai <tiwai@suse.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - mscc,zl38051
      - mscc,zl38060

  reg:
    description:
      SPI chip select or I2C device address.
    maxItems: 1

  mscc,flash-boot:
    type: boolean
    description:
      The device loads its firmware and its configuration record from its
      own flash memory. The operating system must not load firmware or
      change the audio routing, clock or DSP configuration; the DAI rate is
      the one of that configuration.

  spi-max-frequency:
    maximum: 24000000

  reset-gpios:
    description:
      A GPIO line handling reset of the chip. As the line is active low,
      it should be marked GPIO_ACTIVE_LOW (see ../gpio/gpio.txt)
    maxItems: 1

  '#gpio-cells':
    const: 2

  gpio-controller: true

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - '#gpio-cells'
  - gpio-controller
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        codec: zl38060@0 {
            gpio-controller;
            #gpio-cells = <2>;
            #sound-dai-cells = <0>;
            compatible = "mscc,zl38060";
            reg = <0>;
            spi-max-frequency = <12000000>;
            reset-gpios = <&gpio1 0 GPIO_ACTIVE_LOW>;
        };
    };

  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@45 {
            compatible = "mscc,zl38051";
            reg = <0x45>;
            mscc,flash-boot;
            gpio-controller;
            #gpio-cells = <2>;
            #sound-dai-cells = <0>;
            sound-name-prefix = "ZL";
        };
    };
