%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,meson8-audin.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic Meson8 AUDIN audio input controller

maintainers:
  - unex <7575866+unex@users.noreply.github.com>

description:
  The AUDIN block of the Meson8 and Meson8b SoCs receives I2S (and S/PDIF)
  input and writes it to memory through FIFOs. Only the I2S input on FIFO0
  is described here. The I2S input has no clock generator of its own; it
  uses the bit and frame clocks of the AIU I2S encoder, so it is used as a
  capture front-end next to the AIU (amlogic,aiu.yaml).

allOf:
  - $ref: dai-common.yaml#

properties:
  $nodename:
    pattern: "^audio-controller@.*"

  compatible:
    enum:
      - amlogic,meson8-audin
      - amlogic,meson8b-audin

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: AUDIN peripheral clock
      - description: AIU ADC interface clock

  clock-names:
    items:
      - const: pclk
      - const: adc

  resets:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  sound-name-prefix: true

  amlogic,i2s-pos-sync:
    type: boolean
    description:
      Set the POS_SYNC bit of the I2S input control register. The vendor
      kernel sets it for codecs that are driven with an inverted bit clock
      (SND_SOC_DAIFMT_IB_NF), for example the Microsemi ZL380xx.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/meson8b-clkc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/amlogic,meson8b-reset.h>

    audio-controller@a000 {
        compatible = "amlogic,meson8-audin";
        reg = <0xa000 0x300>;
        interrupts = <GIC_SPI 7 IRQ_TYPE_EDGE_RISING>;
        clocks = <&clkc CLKID_I2S_SPDIF>, <&clkc CLKID_ADC>;
        clock-names = "pclk", "adc";
        resets = <&reset RESET_AUDIN>;
        #sound-dai-cells = <0>;
        sound-name-prefix = "AUDIN";
    };
